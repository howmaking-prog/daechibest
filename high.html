<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script>
    // GitHub Pages 모바일 캐시와 슬래시 없는 주소를 바로잡습니다.
    (() => {
      const path = window.location.pathname;
      if (/\/daechibest$/i.test(path)) {
        window.location.replace(path + "/" + window.location.search + window.location.hash);
        return;
      }
      window.SITE_VER = "40";
      const params = new URLSearchParams(window.location.search);
      if (params.get("v") !== window.SITE_VER) {
        params.set("v", window.SITE_VER);
        params.delete("b");
        window.location.replace(path + "?" + params.toString() + window.location.hash);
      }
    })();
  </script>
  <title>고등부 | 대치베스트 어학원</title>
  <meta name="description" content="대치베스트 어학원 고등부 커리큘럼, 시간표, 공지사항" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site-v18.css?v=40" />
</head>
<body data-page="high">
  <script src="js/chrome.js?v=40"></script>
  <script>document.write(DaechiChrome.header());</script>

  <main>
    <section class="dept-hero" aria-label="고등부 배너">
      <div class="slider" id="slider"></div>
      <button class="slider-btn prev" id="sliderPrev" type="button" aria-label="이전 배너">‹</button>
      <button class="slider-btn next" id="sliderNext" type="button" aria-label="다음 배너">›</button>
      <div class="slider-dots" id="sliderDots"></div>
    </section>

    <section class="dept-board" id="board">
      <div class="dept-board-inner">
        <div class="board-grid">
          <article class="timetable-col">
            <div class="board-head">
              <h2>시간표</h2>
              <a class="more-link" id="timeMore" href="#schedulePanel">더보기 &gt;</a>
            </div>
            <div class="grade-tabs" id="gradeTabs"></div>
            <ul class="board-list" id="timetableList"></ul>
          </article>
          <article class="notice-col">
            <div class="board-head">
              <h2>공지사항</h2>
            </div>
            <ul class="board-list" id="noticeList"></ul>
          </article>
          <div class="schedule-panel" id="schedulePanel"></div>
        </div>
      </div>
    </section>
  </main>

  <script>document.write(DaechiChrome.footer(true));</script>

  <script>document.write(DaechiChrome.deptAdmin());</script>

  <div class="toast" id="toast">저장되었습니다.</div>
  <script src="js/app-v8.js?v=40"></script>
  <script src="js/curriculum-v10.js?v=40"></script>
</body>
</html>
